<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>زیرنویس‌ساز شیشه‌ای</title>
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="زیرنویس‌ساز">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=Lalezar&family=Noto+Kufi+Arabic:wght@400;700;900&family=Noto+Naskh+Arabic:wght@400;700&family=Markazi+Text:wght@400;700&family=Inter:wght@400;700;900&family=Montserrat:wght@500;800&family=Bebas+Neue&family=Playfair+Display:wght@700;900&display=swap">
<style>
/* VOICE: a precise pro tool that feels like premium hardware glass — calm, tactile, Persian-first.
   IDEA: an iPhone video editor built from liquid-glass slabs floating over the footage's own light.
   PICTURE: the live 9:16 preview with burned-in subtitles is the hero; controls are glass capsules.
   COLOUR and TYPE: ink-black ambient with warm amber + teal light leaks; Vazirmatn throughout; orange liquid for the one primary action.
   LAYOUT: preview left / settings right on wide screens; stacked preview → glass tab bar → panel on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#e9e6e1,#07080b);--ink:light-dark(#15161a,#f3f1ee);--mute:light-dark(#5d5f66,#a7a9b0);
--glass:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.075));--glass2:light-dark(rgba(255,255,255,.75),rgba(255,255,255,.13));
--edge:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.22));--edge2:light-dark(rgba(0,0,0,.08),rgba(255,255,255,.06));
--sh:light-dark(0 10px 30px rgba(40,30,20,.14),0 14px 44px rgba(0,0,0,.55));
--acc:#ff6a2b;--acc2:#ffb347;--ok:#2ec4a0;--focus:#5ab8ff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Vazirmatn,system-ui,sans-serif;overflow-x:clip;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.amb{position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(70px) saturate(1.3);opacity:light-dark(.55,.9)}
.amb i{position:absolute;border-radius:50%}
.amb i:nth-child(1){width:46vmax;height:46vmax;left:52%;top:4%;background:radial-gradient(circle,#ff8a3d,transparent 65%)}
.amb i:nth-child(2){width:42vmax;height:42vmax;left:2%;top:38%;background:radial-gradient(circle,#1fb5a8,transparent 65%)}
.amb i:nth-child(3){width:36vmax;height:36vmax;left:40%;top:62%;background:radial-gradient(circle,#6f5cff,transparent 65%)}
.glass{background:linear-gradient(140deg,var(--glass2),var(--glass) 55%);border:1px solid var(--edge2);
box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge2),var(--sh);
-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border-radius:28px}
.app{max-width:1240px;margin:0 auto;padding:18px max(3vw,12px) 40px;display:grid;gap:18px;grid-template-columns:minmax(0,430px) minmax(0,1fr);align-items:start}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;justify-content:space-between}
h1{font-size:clamp(22px,3vw,30px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;margin:2px 0 0}
.stage{position:sticky;top:12px;padding:14px;display:grid;gap:12px}
.screen{--ar:.5625;position:relative;width:100%;aspect-ratio:9/16;max-width:calc(72vh * var(--ar));margin:0 auto;border-radius:22px;overflow:hidden;background:#000;
box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.5)}
.screen video,.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen video{object-fit:fill}
.drop{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;color:#fff;background:rgba(0,0,0,.25);
opacity:0;pointer-events:none;transition:opacity .2s}
.screen.dragging .drop{opacity:1}
.demo{position:absolute;top:10px;inset-inline-start:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:99px;
-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ctrl{display:flex;align-items:center;gap:10px}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);white-space:nowrap;direction:ltr}
.pill{appearance:none;border:1px solid var(--edge2);color:var(--ink);font:600 15px/1 Vazirmatn,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;cursor:pointer;
background:linear-gradient(180deg,var(--glass2),var(--glass));box-shadow:inset 0 1px 0 var(--edge),0 4px 14px rgba(0,0,0,.18);
-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.pill:hover{filter:brightness(1.08)}.pill:active{transform:scale(.97)}
.pill.ico{width:44px;flex:none;padding:0}
.pill.pri{color:#fff;border-color:rgba(255,255,255,.35);background:linear-gradient(180deg,#ff9a55,#ff5a1f 60%,#e8460f);
box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 14px rgba(150,30,0,.35),0 10px 26px rgba(255,90,31,.45)}
.pill[disabled]{opacity:.45;pointer-events:none}
.pill.sm{min-height:36px;font-size:13px;padding:0 13px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:9px;background:linear-gradient(270deg,var(--acc2),var(--acc)) 100% 0/var(--p,50%) 100% no-repeat,var(--edge2);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#fff,#e9edf2 60%,#c9ced6);box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 -2px 3px rgba(0,0,0,.1)}
input[type=range]::-moz-range-track{height:8px;border-radius:9px;background:var(--edge2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.panel{padding:12px;display:grid;gap:12px}
.tabs{display:flex;gap:4px;padding:5px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;appearance:none;border:0;background:transparent;color:var(--mute);font:600 14px Vazirmatn,sans-serif;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);background:linear-gradient(180deg,var(--glass2),var(--glass));box-shadow:inset 0 1px 0 var(--edge),0 3px 10px rgba(0,0,0,.2)}
.sec{display:none;padding:6px 6px 10px}.sec.on{display:grid;gap:14px}
.grp{padding:14px;border-radius:22px;display:grid;gap:12px}
.grp h3{margin:0;font-size:14px;font-weight:700;color:var(--mute)}
.row{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr) 56px;align-items:center;gap:10px}
.row label{font-size:14px}
.row .v{font-size:12px;color:var(--mute);text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.row.col{grid-template-columns:minmax(0,110px) minmax(0,1fr)}
select,input[type=text],input[type=number],textarea{font:16px Vazirmatn,sans-serif;color:var(--ink);background:var(--glass);border:1px solid var(--edge2);border-radius:14px;min-height:44px;padding:8px 12px;width:100%;
box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
select option{color:#111}
.sw{display:flex;align-items:center;gap:10px}
input[type=color]{-webkit-appearance:none;appearance:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--edge);padding:0;background:none;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.tog{position:relative;width:54px;height:32px;flex:none}
.tog input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tog span{position:absolute;inset:0;border-radius:99px;background:var(--edge2);box-shadow:inset 0 1px 3px rgba(0,0,0,.3);transition:.2s}
.tog span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dfe3e8);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.2s}
.tog input:checked+span{background:linear-gradient(180deg,#45d9b4,#1aa585)}
.tog input:checked+span::after{inset-inline-start:25px}
.tog input:focus-visible+span{outline:2px solid var(--focus)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--edge2);flex-wrap:wrap}
.seg button{flex:1 1 auto;appearance:none;border:0;background:none;color:var(--mute);font:600 13px Vazirmatn,sans-serif;min-height:36px;padding:0 10px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed=true]{color:var(--ink);background:var(--glass2);box-shadow:inset 0 1px 0 var(--edge),0 2px 8px rgba(0,0,0,.2)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pre{position:relative;appearance:none;border:1px solid var(--edge2);border-radius:20px;padding:0;overflow:hidden;cursor:pointer;background:#111;aspect-ratio:4/3;box-shadow:var(--sh)}
.pre canvas{width:100%;height:100%;display:block}
.pre b{position:absolute;bottom:6px;inset-inline-end:8px;font:600 11px Vazirmatn;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:99px}
.pre .x{position:absolute;top:6px;inset-inline-start:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;cursor:pointer}
.pre.on{outline:2px solid var(--acc);outline-offset:2px}
.list{display:grid;gap:8px;max-height:52vh;overflow:auto;padding:2px}
.it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:10px;border-radius:18px;border:1px solid transparent;background:var(--glass)}
.it.on{border-color:var(--acc);background:linear-gradient(140deg,rgba(255,138,61,.18),var(--glass))}
.it .n{font-size:12px;color:var(--mute);text-align:center;padding-top:10px;font-variant-numeric:tabular-nums}
.it .tt{display:flex;gap:6px;align-items:center;margin-bottom:6px;direction:ltr;justify-content:flex-end}
.it .tt input{width:104px;min-height:34px;padding:4px 8px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.it textarea{min-height:44px;resize:vertical;line-height:1.5}
.it .del{appearance:none;border:0;background:none;color:var(--mute);font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--mute);margin:0}
.empty{padding:22px;text-align:center;color:var(--mute);border:1px dashed var(--edge2);border-radius:18px}
.prog{height:12px;border-radius:9px;background:var(--edge2);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:9px;transition:width .2s}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat div{padding:10px;border-radius:16px;background:var(--glass);text-align:center}
.stat b{display:block;font-size:17px;direction:ltr;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mute)}
.result video{width:100%;max-height:50vh;border-radius:16px;background:#000}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(30px);opacity:0;padding:12px 20px;border-radius:99px;transition:.25s;z-index:9;font-size:14px;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
textarea.srt{min-height:150px;direction:ltr;font-size:13px}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.stage{position:static}.screen{max-width:calc(64vh * var(--ar))}}
@media(max-width:600px){header{flex-direction:column;align-items:stretch}header .bar{justify-content:flex-start}.stat b{font-size:14px}.row{grid-template-columns:minmax(0,92px) minmax(0,1fr) 46px}.row.col{grid-template-columns:minmax(0,92px) minmax(0,1fr)}.app{padding-top:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="amb" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
<header>
 <div><h1>زیرنویس‌ساز شیشه‌ای</h1><p class="sub">ویدیو و فایل SRT را بده، استایل بده، با متنِ تیز خروجی بگیر.</p></div>
 <div class="bar">
  <label class="pill" for="fVid">🎬 ویدیو</label><input id="fVid" type="file" accept="video/*" class="hide">
  <label class="pill" for="fSrt">📄 SRT</label><input id="fSrt" type="file" accept=".srt,.vtt,.txt,text/plain" class="hide">
 </div>
</header>

<section class="stage glass" aria-label="پیش‌نمایش">
 <div class="screen" id="screen">
  <video id="vid" playsinline preload="auto"></video>
  <canvas id="ov"></canvas>
  <span class="demo" id="demoTag">پیش‌نمایش نمونه — ویدیوی خودت را وارد کن</span>
  <div class="drop"><b>رها کن</b><span>ویدیو یا SRT</span></div>
 </div>
 <div class="ctrl">
  <button class="pill ico" id="play" aria-label="پخش">▶</button>
  <input type="range" id="seek" min="0" max="10" step="0.01" value="0" aria-label="زمان">
  <span class="time" id="tm">0:00.0</span>
 </div>
 <div class="ctrl" style="justify-content:space-between">
  <label class="sw"><span class="tog"><input type="checkbox" id="safe"><span></span></span><span class="note">نمایش ناحیهٔ امن اینستاگرام</span></label>
  <button class="pill sm" id="mute">🔊</button>
 </div>
</section>

<section class="panel glass" aria-label="تنظیمات">
 <nav class="tabs glass" role="tablist" id="tabs"></nav>

 <div class="sec on" data-s="subs">
  <div class="grp glass">
   <h3>فایل زیرنویس</h3>
   <div class="bar">
    <label class="pill sm" for="fSrt">وارد کردن SRT / VTT</label>
    <button class="pill sm" id="pasteBtn">چسباندن متن SRT</button>
    <button class="pill sm" id="copySrt">کپی SRT ویرایش‌شده</button>
   </div>
   <div id="pasteBox" class="hide" style="display:grid;gap:8px">
    <textarea class="srt" id="pasteTxt" placeholder="1&#10;00:00:00,000 --> 00:00:02,500&#10;متن زیرنویس"></textarea>
    <div class="bar"><button class="pill sm pri" id="pasteOk">اعمال</button><button class="pill sm" id="pasteNo">انصراف</button></div>
   </div>
   <div class="row col"><label>بدون فاصله</label><label class="sw"><span class="tog"><input type="checkbox" data-o="gapless"><span></span></span><span class="note">هر خط تا شروع خط بعدی بماند</span></label></div>
   <div class="row"><label>جابه‌جایی زمان</label><input type="range" data-o="offset" min="-3" max="3" step="0.05"><span class="v" data-ov="offset"></span></div>
  </div>
  <div class="bar"><span class="note" id="subCount"></span><span style="flex:1"></span><button class="pill sm" id="addSub">＋ خط در زمان فعلی</button></div>
  <div class="list" id="list"></div>
 </div>

 <div class="sec" data-s="pre">
  <div class="presets" id="presets"></div>
  <div class="bar"><button class="pill sm" id="savePre">ذخیرهٔ سبک فعلی</button><button class="pill sm" id="resetPre">برگشت به پیش‌فرض</button></div>
 </div>

 <div class="sec" data-s="text"><div class="grp glass" id="g-text"></div></div>
 <div class="sec" data-s="fx"><div class="grp glass" id="g-stroke"></div><div class="grp glass" id="g-shadow"></div><div class="grp glass" id="g-glow"></div></div>
 <div class="sec" data-s="box"><div class="grp glass" id="g-box"></div></div>
 <div class="sec" data-s="anim"><div class="grp glass" id="g-anim"></div></div>

 <div class="sec" data-s="exp">
  <div class="grp glass" id="g-exp"></div>
  <div class="grp glass">
   <div class="stat"><div><b id="eRes">—</b><span>رزولوشن</span></div><div><b id="eBr">—</b><span>بیت‌ریت</span></div><div><b id="eSz">—</b><span>حجم تقریبی</span></div></div>
   <p class="note" id="eNote"></p>
   <div class="bar"><button class="pill pri" id="goExp" disabled>خروجی گرفتن</button><button class="pill hide" id="stopExp">توقف</button></div>
   <div id="eRun" class="hide" style="display:grid;gap:8px"><div class="prog"><i id="eBar"></i></div><span class="note" id="eMsg"></span></div>
   <div class="result hide" id="eOut" style="display:grid;gap:10px"><video id="eVid" controls playsinline></video><div class="bar"><button class="pill pri" id="saveOut">ذخیرهٔ ویدیو</button><span class="note" id="eInfo"></span></div></div>
  </div>
 </div>
 <div class="grp glass" style="padding:12px">
  <div class="bar"><label class="pill sm" for="fFont">＋ افزودن فونت (TTF / OTF / WOFF)</label><input id="fFont" type="file" accept=".ttf,.otf,.woff,.woff2,font/*" multiple class="hide"><span class="note" id="fontNote">فونت‌هایی مثل پلاک را از فایل اضافه کن؛ روی همین دستگاه می‌مانند.</span></div>
 </div>
</section>
</div>
<div class="toast glass" id="toast"></div>

 if(o.type==='r')return`<div class="row"><label for="c-${o.k}">${o.l}</label><input type="range" id="c-${o.k}" data-k="${o.k}" min="${o.min}" max="${o.max}" step="${o.step}" value="${v}"><span class="v" data-v="${o.k}">${+(+v).toFixed(2)}${o.u}</span></div>`;
 if(o.type==='c')return`<div class="row col"><label for="c-${o.k}">${o.l}</label><span class="sw"><input type="color" id="c-${o.k}" data-k="${o.k}" value="${v}"><span class="note" style="direction:ltr">${v}</span></span></div>`;
 if(o.type==='t')return`<div class="row col"><label>${o.l}</label><label class="sw"><span class="tog"><input type="checkbox" data-k="${o.k}" ${v?'checked':''}><span></span></span></label></div>`;
 if(o.type==='g'||o.type==='ge'){const cur=o.type==='ge'?S.exp[o.k]:v;return`<div class="row col"><label>${o.l}</label><div class="seg" data-${o.type==='ge'?'e':'g'}="${o.k}">${o.opts.map(([a,b])=>`<button type="button" data-val="${a}" aria-pressed="${String(a)===String(cur)}">${b}</button>`).join('')}</div></div>`}
 if(o.type==='f'){const all=[...S.custom,...FONTS];return`<div class="row col"><label for="c-font">فونت</label><select id="c-font" data-k="font">${all.map(f=>`<option ${f===v?'selected':''} style="font-family:'${f}'">${f}</option>`).join('')}</select></div>`}}
function buildCtl(){for(const[id,[h,list]]of Object.entries(GROUPS)){const el=$('#'+id);if(el)el.innerHTML=`<h3>${h}</h3>`+list.map(ctlHTML).join('')}paint();expInfo()}
function paint(){$$('input[type=range]').forEach(r=>r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%'));
 const o=$('[data-o=offset]');o.value=S.opt.offset;$('[data-ov=offset]').textContent=(+S.opt.offset).toFixed(2)+'s';$('[data-o=gapless]').checked=!!S.opt.gapless}
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.k;if(el.type==='range')el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%');
 if(k){let v=el.type==='checkbox'?el.checked:(el.type==='range'?+el.value:el.value);S.style[k]=v;const sv=$(`[data-v="${k}"]`);if(sv){const o=Object.values(GROUPS).flatMap(g=>g[1]).find(x=>x.k===k);sv.textContent=+(+v).toFixed(2)+(o&&o.u||'')}
  if(el.type==='color')el.nextElementSibling.textContent=v;if(k==='font'||k==='weight')ensureFont(S.style).then(render);save();render()}
 const o=el.dataset.o;if(o){S.opt[o]=el.type==='checkbox'?el.checked:+el.value;if(o==='offset')$('[data-ov=offset]').textContent=(+el.value).toFixed(2)+'s';save();render()}});
document.addEventListener('change',e=>{if(e.target.dataset.k==='font'){S.style.font=e.target.value;ensureFont(S.style).then(render);save()}if(e.target.dataset.o==='gapless'){S.opt.gapless=e.target.checked;save();render()}});
document.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;const p=b.parentElement;[...p.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
 if(p.dataset.g){S.style[p.dataset.g]=b.dataset.val;render()}if(p.dataset.e){const v=b.dataset.val;S.exp[p.dataset.e]=p.dataset.e==='fps'?+v:v;expInfo()}save()});

/* ---------- presets ---------- */
function allPresets(){let cu=[];try{cu=JSON.parse(localStorage.getItem(LS+'.pre')||'[]')}catch(e){}return[...PRESETS,...cu.map(x=>({...x,u:1}))]}
function drawPresets(){const P=allPresets();$('#presets').innerHTML=P.map((p,i)=>`<button class="pre ${S.preset===i?'on':''}" data-p="${i}"><canvas width="320" height="240"></canvas><b>${p.n}</b>${p.u?`<span class="x" data-px="${i}" role="button" aria-label="حذف">✕</span>`:''}</button>`).join('');
 $$('#presets canvas').forEach((cv,i)=>{const c=cv.getContext('2d'),st={...BASE,...P[i].s,posY:58,maxW:90,single:true};const g=c.createLinearGradient(0,0,320,240);g.addColorStop(0,'#2b4f7a');g.addColorStop(1,'#c9823f');c.fillStyle=g;c.fillRect(0,0,320,240);
  c.fillStyle='rgba(255,255,255,.08)';c.beginPath();c.arc(230,80,46,0,7);c.fill();
  const scaled={...st,size:st.size*1.9};drawSub(c,320*1.0,240,{s:0,e:3,t:st.anim==='karaoke'?'نمونهٔ کارائوکه':'نمونهٔ زیرنویس'},st.anim==='karaoke'?1.2:1,scaled,cv)})}
$('#presets').onclick=e=>{const x=e.target.closest('[data-px]');const P=allPresets();if(x){let cu=[];try{cu=JSON.parse(localStorage.getItem(LS+'.pre')||'[]')}catch(er){}cu.splice(+x.dataset.px-PRESETS.length,1);try{localStorage.setItem(LS+'.pre',JSON.stringify(cu))}catch(er){}drawPresets();return}
 const b=e.target.closest('.pre');if(!b)return;const i=+b.dataset.p;S.preset=i;const keep={posY:S.style.posY,maxW:S.style.maxW,single:S.style.single};S.style={...BASE,...P[i].s,...(P[i].u?{}:keep)};ensureFont(S.style).then(render);save();buildCtl();drawPresets();render();toast(`سبک «${P[i].n}» اعمال شد`)};
$('#savePre').onclick=()=>{let cu=[];try{cu=JSON.parse(localStorage.getItem(LS+'.pre')||'[]')}catch(e){}cu.push({n:'سبک من '+(cu.length+1),s:{...S.style}});try{localStorage.setItem(LS+'.pre',JSON.stringify(cu))}catch(e){}drawPresets();toast('سبک ذخیره شد')};
$('#resetPre').onclick=()=>{S.style={...BASE};S.preset=0;save();buildCtl();drawPresets();render()};

/* ---------- export ---------- */
function outDims(){const w=hasVid?vid.videoWidth:1080,h=hasVid?vid.videoHeight:1920;const tgt={src:Math.max(w,h),'2k':2560,'4k':3840}[S.exp.res];const s=Math.max(1,tgt/Math.max(w,h));
 return[Math.round(w*s/2)*2,Math.round(h*s/2)*2]}
function srcBr(){return file&&dur?Math.max(1.5e6,file.size*8/dur-160e3):8e6}
function vBr(){const b=srcBr(),[W,H]=outDims();const m={match:1,high:2,max:4}[S.exp.q];let r=b*m;if(S.exp.q!=='match')r=Math.max(r,W*H*S.exp.fps*({high:.08,max:.14}[S.exp.q]));return Math.min(r,80e6)}
function expInfo(){const[W,H]=outDims();$('#eRes').textContent=`${W}×${H}`;$('#eBr').textContent=(vBr()/1e6).toFixed(1)+' Mb/s';$('#eSz').textContent=hasVid?((vBr()+160e3)*dur/8/1048576).toFixed(1)+' MB':'—';
 $('#eNote').textContent=!hasVid?'اول ویدیو را وارد کن.':(S.exp.res!=='src'&&S.exp.q==='match'?'متن مستقیم با دقت خروجی کشیده می‌شود، پس در 4K کاملاً تیز است. بیت‌ریت «هم‌حجم اصلی» حجم را تقریباً ثابت نگه می‌دارد؛ تصویر خودِ ویدیو جزئیات تازه‌ای نمی‌گیرد، فقط متن تیز می‌شود.':'متن به‌صورت برداری با دقت کامل خروجی رسم می‌شود، نه بزرگ‌شدهٔ پیش‌نمایش.')}
let stop=false,outBlob=null;
const seekTo=(v,t)=>new Promise(r=>{const done=()=>{v.removeEventListener('seeked',done);r()};v.addEventListener('seeked',done);v.currentTime=t});
async function pickCodec(W,H,fps,br){const area=W*H,big=area>2228224;const hevc={c:big?'hvc1.1.6.L153.B0':'hvc1.1.6.L123.B0',m:'hevc',x:{hevc:{format:'hevc'}}},avc={c:big?'avc1.640033':'avc1.640028',m:'avc',x:{avc:{format:'avc'}}},avc2={c:'avc1.640034',m:'avc',x:{avc:{format:'avc'}}};
 const order=S.exp.codec==='avc'?[avc,avc2]:S.exp.codec==='hevc'?[hevc]:[hevc,avc,avc2];
 for(const o of order){const cfg={codec:o.c,width:W,height:H,bitrate:Math.round(br),framerate:fps,latencyMode:'quality',...o.x};try{const s=await VideoEncoder.isConfigSupported(cfg);if(s.supported)return{cfg,m:o.m}}catch(e){}}return null}
async function audioTrack(){try{const buf=await file.arrayBuffer();const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();let ab=await new Promise((res,rej)=>{const p=ac.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)});ac.close&&ac.close();return ab}catch(e){return null}}
async function pickAudio(ab){for(const c of [{codec:'mp4a.40.2',m:'aac',sr:ab.sampleRate},{codec:'opus',m:'opus',sr:48000}]){const cfg={codec:c.codec,sampleRate:c.sr,numberOfChannels:Math.min(2,ab.numberOfChannels),bitrate:160000};
 try{const s=await AudioEncoder.isConfigSupported(cfg);if(s.supported)return{cfg,m:c.m}}catch(e){}}return null}
async function resample(ab,sr){if(ab.sampleRate===sr)return ab;const oc=new OfflineAudioContext(Math.min(2,ab.numberOfChannels),Math.ceil(ab.duration*sr),sr);const s=oc.createBufferSource();s.buffer=ab;s.connect(oc.destination);s.start();return await oc.startRendering()}
function ui(on){$('#eRun').classList.toggle('hide',!on);$('#stopExp').classList.toggle('hide',!on);$('#goExp').disabled=on}
const msg=(p,m)=>{$('#eBar').style.width=(p*100).toFixed(1)+'%';$('#eMsg').textContent=m};
$('#stopExp').onclick=()=>{stop=true};
$('#goExp').onclick=async()=>{if(!hasVid)return;stop=false;ui(true);$('#eOut').classList.add('hide');vid.pause();
 try{await ensureFont(S.style);const blob=('VideoEncoder'in window&&window.Mp4Muxer)?await encodeWC():await encodeRT();if(blob){outBlob=blob;showOut(blob)}}
 catch(e){console.error(e);toast('خروجی ناموفق بود: '+(e.message||e))}finally{ui(false)}};
async function encodeWC(){const[W,H]=outDims(),fps=S.exp.fps,br=vBr();msg(0,'آماده‌سازی…');
 const vc=await pickCodec(W,H,fps,br);if(!vc){toast('این مرورگر کدک مناسب ندارد؛ ضبط هم‌زمان استفاده می‌شود');return encodeRT()}
 const ab=await audioTrack();const ac=ab&&'AudioEncoder'in window?await pickAudio(ab):null;
 const tgt=new Mp4Muxer.ArrayBufferTarget();
 const mux=new Mp4Muxer.Muxer({target:tgt,fastStart:'in-memory',firstTimestampBehavior:'offset',video:{codec:vc.m,width:W,height:H,frameRate:fps},...(ac?{audio:{codec:ac.m,numberOfChannels:ac.cfg.numberOfChannels,sampleRate:ac.cfg.sampleRate}}:{})});
 let err=null;const ve=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>err=e});ve.configure(vc.cfg);
 if(ac){msg(0,'رمزگذاری صدا…');const a2=await resample(ab,ac.cfg.sampleRate);const ae=new AudioEncoder({output:(c,m)=>mux.addAudioChunk(c,m),error:e=>err=e});ae.configure(ac.cfg);
  const ch=ac.cfg.numberOfChannels,N=a2.length,B=4096;const chans=[...Array(ch)].map((_,i)=>a2.getChannelData(Math.min(i,a2.numberOfChannels-1)));
  for(let o=0;o<N;o+=B){const n=Math.min(B,N-o),d=new Float32Array(n*ch);for(let c=0;c<ch;c++)d.set(chans[c].subarray(o,o+n),c*n);
   const ad=new AudioData({format:'f32-planar',sampleRate:a2.sampleRate,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(o/a2.sampleRate*1e6),data:d});ae.encode(ad);ad.close()}
  await ae.flush();ae.close()}
 const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=vid.src;v.style.cssText='position:fixed;width:2px;height:2px;opacity:0;pointer-events:none';document.body.appendChild(v);
 await new Promise(r=>{if(v.readyState>=2)r();else v.onloadeddata=r});
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d',{alpha:false});c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
 const N=Math.floor(dur*fps),t0=performance.now();
 try{for(let n=0;n<N;n++){if(stop)throw new Error('متوقف شد');if(err)throw err;const t=n/fps;await seekTo(v,Math.min(dur-.001,t+.001));
  c.drawImage(v,0,0,W,H);drawSub(c,W,H,active(t),t,S.style,v);
  const fr=new VideoFrame(cv,{timestamp:Math.round(t*1e6),duration:Math.round(1e6/fps)});ve.encode(fr,{keyFrame:n%(fps*2)===0});fr.close();
  while(ve.encodeQueueSize>3)await new Promise(r=>setTimeout(r,4));
  if(n%5===0){const el=(performance.now()-t0)/1000,eta=el/(n+1)*(N-n-1);msg((n+1)/N,`فریم ${n+1} از ${N} — حدود ${Math.ceil(eta)} ثانیه مانده`)}}
  await ve.flush();ve.close();mux.finalize()}finally{v.remove()}
 if(err)throw err;msg(1,'تمام شد');return new Blob([tgt.buffer],{type:'video/mp4'})}
async function encodeRT(){const[W,H]=outDims(),fps=S.exp.fps;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
 const v=document.createElement('video');v.playsInline=true;v.src=vid.src;v.style.cssText='position:fixed;width:2px;height:2px;opacity:0';document.body.appendChild(v);await new Promise(r=>{if(v.readyState>=2)r();else v.onloadeddata=r});
 const st=cv.captureStream(fps);try{const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),src=ac.createMediaElementSource(v),d=ac.createMediaStreamDestination();src.connect(d);d.stream.getAudioTracks().forEach(t=>st.addTrack(t))}catch(e){}
 const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));if(!mime)throw new Error('ضبط ویدیو در این مرورگر پشتیبانی نمی‌شود');
 const rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:Math.round(vBr())});const parts=[];rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
 let live=true;const draw=()=>{if(!live)return;c.drawImage(v,0,0,W,H);drawSub(c,W,H,active(v.currentTime),v.currentTime,S.style,v);msg(v.currentTime/dur,'ضبط هم‌زمان (به اندازهٔ طول ویدیو طول می‌کشد)…');
  if(stop){v.pause();rec.stop();return}v.requestVideoFrameCallback?v.requestVideoFrameCallback(draw):requestAnimationFrame(draw)};
 const done=new Promise(r=>rec.onstop=r);rec.start(500);await v.play();draw();v.onended=()=>{live=false;rec.stop()};await done;live=false;v.remove();
 if(stop)throw new Error('متوقف شد');return new Blob(parts,{type:mime.split(';')[0]})}
let dl=null;(async()=>{try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}})();
function showOut(b){const u=URL.createObjectURL(b);$('#eVid').src=u;$('#eOut').classList.remove('hide');$('#eInfo').textContent=`${(b.size/1048576).toFixed(1)} MB — ${b.type.includes('webm')?'WebM':'MP4'}`;toast('خروجی آماده است')}
$('#saveOut').onclick=async()=>{if(!outBlob)return;const name=`subtitled-${Date.now()}.${outBlob.type.includes('webm')?'webm':'mp4'}`;
 if(dl){try{await dl.save({filename:name,data:outBlob});toast('ذخیره شد');return}catch(e){if(e&&e.code==='declined')return;toast('ذخیره ممکن نشد: '+(e.code||e.message||''));return}}
 try{const f=new File([outBlob],name,{type:outBlob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'زیرنویس‌ساز'});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(outBlob);a.download=name;document.body.appendChild(a);a.click();a.remove()};

/* ---------- init ---------- */
buildCtl();renderList();render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
